name: elmadawy_market
description: تطبيق عملاء المعداوي ماركت
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  supabase_flutter: 2.9.1
  shared_preferences: 2.5.3
  mobile_scanner: 7.0.1
  geolocator: 14.0.2
  flutter_map: 8.2.1
  latlong2: 0.9.1
  url_launcher: 6.3.2
  image_picker: 1.1.2
  barcode_widget: 2.0.4
  uuid: 4.5.1
  intl: 0.20.2
dev_dependencies:
  http: 1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
