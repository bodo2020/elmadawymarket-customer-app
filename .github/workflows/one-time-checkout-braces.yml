name: One-time Checkout Braces Fix

on:
  push:
    branches:
      - work/sync-current-customer-20260910

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sync-current-customer-20260910
      - name: Add required braces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/checkout_v2.dart')
          text = p.read_text()
          replacements = [
              (
                  "    if (saved != null)\n      return number(saved['p_voucher_amount']).clamp(0, grossTotal);",
                  "    if (saved != null) {\n      return number(saved['p_voucher_amount']).clamp(0, grossTotal);\n    }",
              ),
              (
                  "                        if (context.mounted)\n                          message(context, 'تم نسخ رقم المحفظة');",
                  "                        if (context.mounted) {\n                          message(context, 'تم نسخ رقم المحفظة');\n                        }",
              ),
              (
                  "      if (quantity >= 1000)\n        return '${(quantity / 1000).toStringAsFixed(2)} كجم';",
                  "      if (quantity >= 1000) {\n        return '${(quantity / 1000).toStringAsFixed(2)} كجم';\n      }",
              ),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "bodo2020"
          git config user.email "bodo2020@users.noreply.github.com"
          git add lib/screens/checkout_v2.dart
          git commit -m "fix: add required checkout v2 braces"
          git push origin HEAD:work/sync-current-customer-20260910
