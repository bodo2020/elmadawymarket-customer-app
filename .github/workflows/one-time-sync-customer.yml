name: One-time customer sync

on:
  push:
    branches:
      - work/sync-current-customer-20260910
    paths:
      - .github/workflows/one-time-sync-customer.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sync-current-customer-20260910
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.8'
          cache: true
      - name: Route account notifications to V2
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/account.dart')
          text = path.read_text(encoding='utf-8')
          import_line = "import 'notifications_v2.dart';\n"
          if import_line not in text:
              marker = "import 'returns.dart';\n"
              if marker not in text:
                  raise SystemExit('returns import marker not found')
              text = text.replace(marker, marker + import_line, 1)
          old = "onNotifications: () => open(context, const NotificationsPage()),"
          new = "onNotifications: () => open(context, const NotificationsV2Page()),"
          if old not in text and new not in text:
              raise SystemExit('account notification route marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Format and validate
        run: |
          dart format lib/main.dart lib/screens/notifications_v2.dart lib/screens/account.dart
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit generated sync
        run: |
          rm .github/workflows/one-time-sync-customer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/screens/notifications_v2.dart lib/screens/account.dart .github/workflows/one-time-sync-customer.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finish current customer app sync [sync-generated]"
          git push origin HEAD:work/sync-current-customer-20260910
