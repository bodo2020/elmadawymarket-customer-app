name: One-time Product V2 Braces Fix

on:
  push:
    branches:
      - work/sync-current-customer-20260910

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/sync-current-customer-20260910

      - name: Apply remaining braces cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/product_v2.dart')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "      if (widget.bulkOnly && !unit.bulk) return true;": "      if (widget.bulkOnly && !unit.bulk) {\n        return true;\n      }",
              "      if (onlyAvailable && unit.product.maxQuantity(unit.bulk) <= 0) return true;": "      if (onlyAvailable && unit.product.maxQuantity(unit.bulk) <= 0) {\n        return true;\n      }",
              "        if (unit.bulk) return true;": "        if (unit.bulk) {\n          return true;\n        }",
              "        if (!(offer > 0 && offer < original)) return true;": "        if (!(offer > 0 && offer < original)) {\n          return true;\n        }",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git config user.name "bodo2020"
          git config user.email "bodo2020@users.noreply.github.com"
          git add lib/screens/product_v2.dart
          git commit -m "fix: use braces in product v2 filters"
          git push origin HEAD:work/sync-current-customer-20260910
