name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'work/**'

jobs:
  analyze-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        shell: bash
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found; skipping flutter test."
          fi

      - name: Build web
        run: flutter build web --release --dart-define=SUPABASE_ANON_KEY=dummy-ci-key
